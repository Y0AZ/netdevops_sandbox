# =============================================================
#  PIPELINE CI — le cœur du NetDevOps
#  À chaque push : on régénère les configs, on valide la
#  conformité, on lance les tests. Si une règle est violée,
#  la pipeline échoue et le changement n'est pas mergé.
# =============================================================
name: netdevops-ci

on:
  push:
  pull_request:

jobs:
  build-validate-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Génération des configs
        run: python generate.py

      - name: Contrôle de conformité
        run: python validate.py

      - name: Tests automatisés
        run: pytest -v
